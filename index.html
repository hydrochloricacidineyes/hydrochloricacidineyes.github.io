	}

	// How long a shell that loads the engine late gets before the overlay gives up

	var GRACE_MS = 3000;
	var ROOT_ID = "ebs";
	var DONE_CLASS = "is-done";
	var SMOOTH_CLASS = "is-smooth";
	var MAX_TICK_MS = 100;
	var SETTLE_EPSILON = 0.0005;
	var CLOSE_90_TAUS = Math.log(10);

	var progressHandlers = [];
	var doneHandlers = [];
	var root = null;
	var finished = false;
	var dismissed = false;
	var sawEngine = false;
	var ratio = 0;
	var current = 0;
	var total = 0;
	var displayed = 0;
	var animating = false;
	var lastTick = 0;
	var pendingDismiss = false;
	var failedFinish = false;
	var floorRatio = 0;
	var dismissCeiling = 0;

	function findRoot() {
		if (root === null) {
			root = document.getElementById(ROOT_ID);
		}

		return root;
	}

	function call(handler, args) {
		try {
			handler.apply(null, args);
		} catch (error) {
			console.error("EBS: handler failed.", error);
		}
	}

	function smoothingMs() {
		var value = Number(api.params && api.params.progress_smoothing_ms);

		return isFinite(value) && value > 0 ? value : 0;
	}

	function awaitsFull() {
		return !!(api.params && api.params.hide_awaits_full_progress === true);
	}

	function render(value) {
		var node = findRoot();

		if (node) {
			node.style.setProperty("--ebs-progress", String(value));
			node.style.setProperty("--ebs-progress-percent", (value * 100).toFixed(2) + "%");
		}
	}

	function targetRatio() {
		var value = Math.max(ratio, floorRatio);

		return pendingDismiss ? Math.min(value, dismissCeiling) : value;
	}

	function tick(now) {
		if (dismissed) {
			animating = false;
			return;
		}

		var target = targetRatio();
		var ms = smoothingMs();
		var dt = Math.min(Math.max(now - lastTick, 0), MAX_TICK_MS);

		lastTick = now;

		if (target <= displayed || !(ms > 0)) {
			displayed = target;
		} else {
			var gap = target - displayed;
			var step = gap * (1 - Math.exp(-dt * CLOSE_90_TAUS / ms));

			if (pendingDismiss) {

			}

		}

		}

		}

	}

	function finish(failed) {
		if (failed) {
			failedFinish = true;
		}

			if (failed) {

			}

			return;
		}

		finished = true;
		setProgress(1, 1);

		for (var i = 0; i < doneHandlers.length; i++) {

		params: {},

		},

		},

		}
	};

	window.EBS = api;

	function wrapEngine(engineClass) {

		}

	}

	// Rendered bottom edge of the artwork, consumed by the template's
	// "below" placement for cover/contain.
	function updateArtBottom() {
		var node = findRoot();

		if (!node) {
			return;
		}

		var bottom;

		if (node.classList.contains("fit-cover")) {
			bottom = node.clientHeight;
		} else if (node.classList.contains("fit-contain")) {
			var art = node.querySelector("img");

			}

		} else {
			return;
		}

	}

	function hydrateArt() {
		var node = findRoot();
		var art = node && node.querySelector("[data-src]");

		if (!art) {
			return;
		}

		var src = art.getAttribute("data-src");

		if (!src) {
			art.remove();
			return;
		}

		art.addEventListener("load", updateArtBottom);
		art.setAttribute("src", src);
		window.addEventListener("resize", updateArtBottom);
		updateArtBottom();
	}

	function observeShell() {
		hydrateArt();

		var progress = document.getElementById("status-progress");

		if (progress && !sawEngine) {
			var sync = function () {
				var max = Number(progress.max) || 0;

				}
			};

			new MutationObserver(sync).observe(progress, {
				attributes: true,
				attributeFilter: ["value", "max"]
			});
			sync();
		}

		var notice = document.getElementById("status-notice");

		if (notice) {
			var checkNotice = function () {
				if (notice.style.display === "block") {
					finish(true);
				}
			};

			new MutationObserver(checkNotice).observe(notice, {
				attributes: true,
				attributeFilter: ["style"]
			});

			checkNotice();
		}

		if (status && status.parentNode) {
			new MutationObserver(function (records, observer) {
				if (!document.getElementById("status")) {
					observer.disconnect();
					finish(false);
				}

		} else {
			window.setTimeout(function () {
				if (total === 0) {
					finish(true);
				}
			}, GRACE_MS);
		}
	}

	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", observeShell);
	} else {
		observeShell();
	}
})();
</script>

<style>
	#ebs {
		position: absolute;
		inset: 0;
		z-index: 3;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		--ebs-gap: 32px;
		gap: var(--ebs-gap);
		background: #5F5F5F;
		opacity: 1;
		transition: opacity 0.35s ease-out;
	}

	#ebs.is-done {
		opacity: 0;
		pointer-events: none;
	}

	#ebs-art {
		width: 256px;
		max-width: 60vw;
		height: auto;
		max-height: 50vh;
		object-fit: contain;
	}

	#ebs.fit-cover #ebs-art,
	#ebs.fit-contain #ebs-art {
		position: absolute;
		inset: 0;
		width: 100%;
		max-width: none;
		height: 100%;
		max-height: none;
	}

	#ebs.fit-cover #ebs-art {
		object-fit: cover;
	}

	#ebs.fit-contain #ebs-art {
		object-fit: contain;
	}

	#ebs-track {
		position: relative;
		width: min(50vw, 360px);
		height: 10px;
		border-radius: 999px;
		overflow: hidden;
		background: rgba(255, 255, 255, 0.9);
		box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 2px 12px rgba(0, 0, 0, 0.3);
	}

	#ebs-track.hidden-true {
		display: none;
	}

	#ebs-track.pos-top,
	#ebs-track.pos-center,
	#ebs-track.pos-bottom {
		position: absolute;
		left: 50%;
		transform: translateX(-50%);
	}

	#ebs-track.pos-top {
		top: 12px;
	}

	#ebs-track.pos-center {
		top: 50%;
		transform: translate(-50%, -50%);
	}

	#ebs-track.pos-bottom {
		bottom: 12px;
	}

	/* runtime.js measures the rendered art bottom into --ebs-art-bottom;
	   clamped to the page bottom when there is no room under the image. */
	#ebs.fit-cover #ebs-track.pos-below,
	#ebs.fit-contain #ebs-track.pos-below {
		position: absolute;
		left: 50%;
		transform: translateX(-50%);
		top: min(calc(var(--ebs-art-bottom, 100%) + var(--ebs-gap)), calc(100% - 12px - 10px));
	}

	#ebs-fill {
		width: var(--ebs-progress-percent, 0%);
		height: 100%;
		background: #FF244A;
		transition: width 0.2s linear;
	}

	#ebs.is-smooth #ebs-fill {
		transition: none;
	}
</style>
